name: Fortune Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: fortune-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  post-fortune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'

      - name: Download modules
        run: go mod tidy

      - name: Run bot
        env:
          MIXI2_CLIENT_ID: ${{ secrets.MIXI2_CLIENT_ID }}
          MIXI2_CLIENT_SECRET: ${{ secrets.MIXI2_CLIENT_SECRET }}
          MIXI2_TOKEN_URL: ${{ secrets.MIXI2_TOKEN_URL }}
          MIXI2_API_ADDRESS: ${{ secrets.MIXI2_API_ADDRESS }}
        run: go run ./cmd/bot/main.go
